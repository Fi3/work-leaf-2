name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install exact test runtimes
        shell: bash
        run: |
          set -euo pipefail
          task_tools="$RUNNER_TEMP/harness-tools"
          mkdir -p "$task_tools/node" "$task_tools/nvim" "$task_tools/kitty" "$task_tools/firefox"
          curl -fsSL https://nodejs.org/dist/v26.10.0/node-v26.10.0-linux-x64.tar.xz -o "$task_tools/node.tar.xz"
          echo "ca70e9e349de048b9522abb3adc05b3bd6f43c5ffd3ec57916c7da292f59f022  $task_tools/node.tar.xz" | sha256sum --check
          tar -xJf "$task_tools/node.tar.xz" --strip-components=1 -C "$task_tools/node"
          export PATH="$task_tools/node/bin:$PATH"
          npm install --global --ignore-scripts --prefix "$task_tools/node" npm@12.2.0
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz -o "$task_tools/nvim.tar.gz"
          echo "474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87  $task_tools/nvim.tar.gz" | sha256sum --check
          tar -xzf "$task_tools/nvim.tar.gz" --strip-components=1 -C "$task_tools/nvim"
          echo "$task_tools/node/bin" >> "$GITHUB_PATH"
          echo "$task_tools/nvim/bin" >> "$GITHUB_PATH"
          curl -fsSL https://github.com/kovidgoyal/kitty/releases/download/v0.49.2/kitty-0.49.2-x86_64.txz -o "$task_tools/kitty.txz"
          echo "d573618b911e9c461bd421b96c13c74c7f1cb2f1ac9c327818d4ff84366cf5c6  $task_tools/kitty.txz" | sha256sum --check
          tar -xJf "$task_tools/kitty.txz" -C "$task_tools/kitty"
          echo "$task_tools/kitty/bin" >> "$GITHUB_PATH"
          curl -fsSL https://archive.mozilla.org/pub/firefox/releases/157.0.1/linux-x86_64/en-US/firefox-157.0.1.tar.xz -o "$task_tools/firefox.tar.xz"
          echo "0d92bf39cdd174f5f361008509310bdefbce72a57ca10523a43b32d62dc699b6  $task_tools/firefox.tar.xz" | sha256sum --check
          tar -xJf "$task_tools/firefox.tar.xz" --strip-components=1 -C "$task_tools/firefox"
          echo "$task_tools/firefox" >> "$GITHUB_PATH"
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Install reviewed packages
        run: npm ci --ignore-scripts
      - name: Install desktop test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libgtk-3-0t64 libasound2t64 libxtst6 openssh-client openssh-server iproute2 uidmap
          sudo install -d -m 755 /run/sshd
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run the complete release gate
        run: sh scripts/check.sh
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-test-evidence
          path: |
            tests/evidence/
            /tmp/harness-nvim-ui-evidence-*/
            /tmp/hs-*/observed.json
            /tmp/hs-*/**/terminal.raw
            /tmp/hs-*/gui/*.png
